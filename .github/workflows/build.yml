name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    # Documentation and store-asset changes can't affect the APK, so skip the
    # ~5 minute build for them. GitHub skips path filters entirely for tag
    # pushes, so release builds on v* tags are unaffected by this list.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'store/**'
      - 'apk/**'
      - '.gitignore'
      - '.github/**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'store/**'
      - 'apk/**'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    # The default workflow token is read-only, which makes creating a release
    # on a tag push fail with a 403. Only the release step needs more.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Prepare release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/locreminder-release.jks"
            echo "path=$GITHUB_WORKSPACE/android/locreminder-release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        env:
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: location-alarm-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true

      # Keeps the README's download button serving the current build without
      # anyone having to remember to do it. Only ever one APK is tracked: the
      # new one overwrites the old in place, so history gains one ~53MB blob
      # per release rather than one per release *plus* every predecessor.
      - name: Publish the APK for direct download
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk apk/locreminder.apk

          # Nothing to do when the build is byte-identical to what's already
          # published, which is the common case for doc-only pushes.
          if git diff --quiet -- apk/locreminder.apk; then
            echo "APK unchanged; nothing to publish."
            exit 0
          fi

          version=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/locreminder.apk
          git commit -m "Publish the v${version} APK for direct download [skip ci]"

          # Another push may have landed while this build ran; rebase rather
          # than fail, since this commit only ever touches the one binary.
          git pull --rebase origin main
          git push origin HEAD:main

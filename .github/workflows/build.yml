name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    # Documentation and store-asset changes can't affect the APK, so skip the
    # ~5 minute build for them. GitHub skips path filters entirely for tag
    # pushes, so release builds on v* tags are unaffected by this list.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'store/**'
      - 'apk/**'
      - '.gitignore'
      - '.github/**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'store/**'
      - 'apk/**'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    # The default workflow token is read-only, which makes creating a release
    # on a tag push fail with a 403. Only the release step needs more.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # A tag is what publishes a Release, so it is the point where debug
      # signing stops being a harmless convenience and starts being shipped to
      # users. Without this gate the Gradle fallback quietly signs with the
      # debug key — which is public and shared by every Android SDK install,
      # so it identifies nobody and lets anyone forge an update. Every release
      # up to v1.6.5 went out that way precisely because nothing complained.
      - name: Require a real signing key for published builds
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD"  ] && missing="$missing RELEASE_STORE_PASSWORD"
          [ -z "$KEY_ALIAS"       ] && missing="$missing RELEASE_KEY_ALIAS"
          [ -z "$KEY_PASSWORD"    ] && missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Refusing to publish a release. Missing secrets:$missing"
            echo "Set them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Prepare release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/locreminder-release.jks"
            echo "path=$GITHUB_WORKSPACE/android/locreminder-release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        env:
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: flutter build apk --release

      # Belt and braces: the gate above proves the secrets exist, this proves
      # they were actually used. Gradle's fallback is silent, so the only
      # trustworthy evidence is the certificate in the finished APK.
      - name: Verify the published APK is not debug-signed
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found; cannot verify the signature."
            exit 1
          fi
          certs=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$certs"
          if echo "$certs" | grep -qi "CN=Android Debug"; then
            echo "::error::APK is signed with the public Android debug key. Refusing to publish."
            exit 1
          fi

      # Runs before the Release is created, so a build that looks like malware
      # never gets published in the first place.
      - name: Scan the APK with VirusTotal
        id: virustotal
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          chmod +x .github/scripts/virustotal-scan.sh
          .github/scripts/virustotal-scan.sh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: location-alarm-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
          # Carries the hash as well as the verdict: the hash is what lets a
          # reader confirm the file they downloaded is the file that was
          # scanned, which the result on its own does not establish.
          body: ${{ steps.virustotal.outputs.release_note }}

      # A tiny JSON the README's badge reads, plus a page recording every
      # scan. Text files of a few hundred bytes, so unlike the APK they cost
      # the repository nothing to keep forever.
      - name: Record the scan result
        if: startsWith(github.ref, 'refs/tags/v') && steps.virustotal.outputs.status == 'completed'
        env:
          FLAGGED: ${{ steps.virustotal.outputs.detections }}
          TOTAL: ${{ steps.virustotal.outputs.total }}
          SHA256: ${{ steps.virustotal.outputs.sha256 }}
          PERMALINK: ${{ steps.virustotal.outputs.permalink }}
          VERSION: ${{ github.ref_name }}
        run: |
          # This job checks out a tag, in detached HEAD, and the build leaves
          # tracked files modified behind it (pub get touches pubspec.lock).
          # So start from a clean copy of current main and regenerate there:
          # rebasing a tag commit over a dirty tree is what broke this before,
          # and writing the table from the tag's copy would clobber any row
          # added since.
          git fetch origin main
          git checkout -f -B record-scan FETCH_HEAD

          mkdir -p .github/badges
          colour=brightgreen
          [ "$FLAGGED" -gt 0 ] && colour=orange
          printf '{"schemaVersion":1,"label":"VirusTotal","message":"%s/%s","color":"%s"}\n' \
            "$FLAGGED" "$TOTAL" "$colour" > .github/badges/virustotal.json

          # Newest first, directly under the table header.
          row="| [\`$VERSION\`](https://github.com/${GITHUB_REPOSITORY}/releases/tag/$VERSION) | $FLAGGED / $TOTAL | [report]($PERMALINK) | \`$SHA256\` |"
          awk -v row="$row" '
            {print}
            /^\|---/ && !done {print row; done=1}
          ' docs/SECURITY-SCAN.md > docs/SECURITY-SCAN.md.tmp
          mv docs/SECURITY-SCAN.md.tmp docs/SECURITY-SCAN.md

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/virustotal.json docs/SECURITY-SCAN.md
          git diff --cached --quiet && { echo "No change to record."; exit 0; }
          git commit -m "Record the $VERSION VirusTotal scan [skip ci]"
          git push origin HEAD:main

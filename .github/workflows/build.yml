name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    # Documentation and store-asset changes can't affect the APK, so skip the
    # build for them. GitHub skips path filters entirely for tag pushes, so
    # release builds on v* tags are unaffected by this list.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'store/**'
      - 'apk/**'
      - '.gitignore'
      - '.github/**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'store/**'
      - 'apk/**'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    # Releases are compiled inside F-Droid's own buildserver image, at the
    # paths F-Droid uses, because F-Droid rebuilds this app and compares the
    # result byte for byte. Matching versions was not enough: with the NDK,
    # CMake, Flutter, build path, package cache and locked dependencies all
    # provably identical, libdartjni.so still differed. The remaining
    # variables are the ones a shared image removes at a stroke, so rather
    # than chase them one release at a time, build where F-Droid builds.
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
      options: --user root

    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    env:
      # F-Droid's own layout: the app under build/<applicationId>, the Flutter
      # srclib beside it. Flutter records both the project and SDK paths in
      # what it compiles, so these have to agree, not merely be pinned.
      BUILD_DIR: /home/vagrant/build/com.zaifears.locreminder
      FLUTTER_DIR: /home/vagrant/build/srclib/flutter
      FLUTTER_VERSION: '3.47.1'
      ANDROID_NDK_VERSION: '28.2.13676358'
      # The image exports these from /etc/profile.d/bsenv.sh, which GitHub
      # does not source, so steps would otherwise see them empty and resolve
      # paths like "/ndk/28.2.13676358".
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      # F-Droid builds as the vagrant user; keeping HOME there puts .gradle
      # and .android in the same place on both sides.
      HOME: /home/vagrant

    steps:
      - name: Install what the image lacks
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends jq git curl unzip xz-utils
          git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage the source where F-Droid builds it
        run: |
          mkdir -p "$(dirname "$BUILD_DIR")"
          rm -rf "$BUILD_DIR"
          cp -a "$GITHUB_WORKSPACE" "$BUILD_DIR"

      # Cloned rather than taken from a setup action, so the SDK lands on the
      # same path F-Droid's srclib uses and sits at the same commit.
      - name: Set up Flutter
        run: |
          git clone --quiet https://github.com/flutter/flutter.git "$FLUTTER_DIR"
          git -C "$FLUTTER_DIR" checkout -f "$FLUTTER_VERSION"
          "$FLUTTER_DIR/bin/flutter" config --no-analytics
          "$FLUTTER_DIR/bin/flutter" --version

      - name: Pin the NDK
        run: |
          ndk="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          [ -d "$ndk" ] || sdkmanager "ndk;$ANDROID_NDK_VERSION"
          test -d "$ndk" || { echo "::error::NDK $ANDROID_NDK_VERSION unavailable"; exit 1; }
          for v in ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK; do
            echo "$v=$ndk" >> "$GITHUB_ENV"
          done

      # --enforce-lockfile, not a plain pub get. Without it resolution picks
      # whatever versions it likes and rewrites the lockfile in place, which
      # is how the committed copy drifted far enough to still name geolocator
      # long after 1.6.0 removed it. Regenerate deliberately, via the
      # refresh-lockfile workflow.
      - name: Install dependencies
        working-directory: /home/vagrant/build/com.zaifears.locreminder
        run: |
          export PUB_CACHE="$BUILD_DIR/.pub-cache"
          "$FLUTTER_DIR/bin/flutter" pub get --enforce-lockfile

      - name: Analyze
        working-directory: /home/vagrant/build/com.zaifears.locreminder
        run: |
          export PUB_CACHE="$BUILD_DIR/.pub-cache"
          "$FLUTTER_DIR/bin/flutter" analyze

      - name: Run tests
        working-directory: /home/vagrant/build/com.zaifears.locreminder
        run: |
          export PUB_CACHE="$BUILD_DIR/.pub-cache"
          "$FLUTTER_DIR/bin/flutter" test

      # A tag is what publishes a Release, so it is where debug signing stops
      # being a harmless convenience and starts being shipped to users. Every
      # release up to v1.6.5 went out debug-signed precisely because nothing
      # complained.
      - name: Require a real signing key for published builds
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD"  ] && missing="$missing RELEASE_STORE_PASSWORD"
          [ -z "$KEY_ALIAS"       ] && missing="$missing RELEASE_KEY_ALIAS"
          [ -z "$KEY_PASSWORD"    ] && missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Refusing to publish a release. Missing secrets:$missing"
            exit 1
          fi

      - name: Prepare release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$BUILD_DIR/android/locreminder-release.jks"
            echo "path=$BUILD_DIR/android/locreminder-release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        working-directory: /home/vagrant/build/com.zaifears.locreminder
        env:
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export PUB_CACHE="$BUILD_DIR/.pub-cache"
          "$FLUTTER_DIR/bin/flutter" build apk --release

      # Brought back into the workspace so the upload and release actions,
      # which expect paths under it, can reach the file.
      - name: Collect the APK
        run: cp "$BUILD_DIR/build/app/outputs/flutter-apk/app-release.apk" "$GITHUB_WORKSPACE/app-release.apk"

      # The gate above proves the secrets exist; this proves they were used.
      # Gradle's fallback to the debug key is silent, so the finished APK is
      # the only trustworthy evidence.
      - name: Verify the published APK is not debug-signed
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          [ -n "$apksigner" ] || { echo "::error::apksigner not found"; exit 1; }
          certs=$("$apksigner" verify --print-certs "$GITHUB_WORKSPACE/app-release.apk")
          echo "$certs"
          if echo "$certs" | grep -qi "CN=Android Debug"; then
            echo "::error::APK is signed with the public Android debug key. Refusing to publish."
            exit 1
          fi

      # Runs before the Release exists, so a build that looks like malware is
      # never published in the first place.
      - name: Scan the APK with VirusTotal
        id: virustotal
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          chmod +x .github/scripts/virustotal-scan.sh
          .github/scripts/virustotal-scan.sh "$GITHUB_WORKSPACE/app-release.apk"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: location-alarm-apk
          path: app-release.apk
          if-no-files-found: error

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app-release.apk
          generate_release_notes: true
          # Carries the hash as well as the verdict: the hash is what lets a
          # reader confirm the file they downloaded is the file that was
          # scanned, which the result alone does not establish.
          body: ${{ steps.virustotal.outputs.release_note }}

      # A tiny JSON the README badge reads, plus a page recording every scan.
      # A few hundred bytes each, so unlike the APK they cost nothing to keep.
      - name: Record the scan result
        if: startsWith(github.ref, 'refs/tags/v') && steps.virustotal.outputs.status == 'completed'
        env:
          FLAGGED: ${{ steps.virustotal.outputs.detections }}
          TOTAL: ${{ steps.virustotal.outputs.total }}
          SHA256: ${{ steps.virustotal.outputs.sha256 }}
          PERMALINK: ${{ steps.virustotal.outputs.permalink }}
          VERSION: ${{ github.ref_name }}
        run: |
          # This job checks out a tag, detached, and the build leaves tracked
          # files modified behind it. Start from a clean copy of current main
          # and regenerate there, so nothing is rebased over a dirty tree and
          # no row added since is clobbered.
          git fetch origin main
          git checkout -f -B record-scan FETCH_HEAD

          mkdir -p .github/badges
          colour=brightgreen
          [ "$FLAGGED" -gt 0 ] && colour=orange
          printf '{"schemaVersion":1,"label":"VirusTotal","message":"%s/%s","color":"%s"}\n' \
            "$FLAGGED" "$TOTAL" "$colour" > .github/badges/virustotal.json

          row="| [\`$VERSION\`](https://github.com/${GITHUB_REPOSITORY}/releases/tag/$VERSION) | $FLAGGED / $TOTAL | [report]($PERMALINK) | \`$SHA256\` |"
          awk -v row="$row" '
            {print}
            /^\|---/ && !done {print row; done=1}
          ' docs/SECURITY-SCAN.md > docs/SECURITY-SCAN.md.tmp
          mv docs/SECURITY-SCAN.md.tmp docs/SECURITY-SCAN.md

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/virustotal.json docs/SECURITY-SCAN.md
          git diff --cached --quiet && { echo "No change to record."; exit 0; }
          git commit -m "Record the $VERSION VirusTotal scan [skip ci]"
          git push origin HEAD:main

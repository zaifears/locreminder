name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    # Documentation and store-asset changes can't affect the APK, so skip the
    # build for them. GitHub skips path filters entirely for tag pushes, so
    # release builds on v* tags are unaffected by this list.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'store/**'
      - 'apk/**'
      - '.gitignore'
      - '.github/**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'store/**'
      - 'apk/**'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    # Releases are compiled inside F-Droid's own buildserver image, at the
    # paths F-Droid uses, because F-Droid rebuilds this app and compares the
    # result byte for byte. Matching versions was not enough: with the NDK,
    # CMake, Flutter, build path, package cache and locked dependencies all
    # provably identical, libdartjni.so still differed. The remaining
    # variables are the ones a shared image removes at a stroke, so rather
    # than chase them one release at a time, build where F-Droid builds.
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
      options: --user root

    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    env:
      # F-Droid's own layout: the app under build/<applicationId>, the Flutter
      # srclib beside it. Flutter records both the project and SDK paths in
      # what it compiles, so these have to agree, not merely be pinned.
      BUILD_DIR: /home/vagrant/build/com.zaifears.locreminder
      FLUTTER_DIR: /home/vagrant/build/srclib/flutter
      FLUTTER_VERSION: '3.47.1'
      ANDROID_NDK_VERSION: '28.2.13676358'
      # The image exports these from /etc/profile.d/bsenv.sh, which GitHub
      # does not source, so steps would otherwise see them empty and resolve
      # paths like "/ndk/28.2.13676358".
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      # F-Droid builds as the vagrant user; keeping HOME there puts .gradle
      # and .android in the same place on both sides.
      HOME: /home/vagrant

    steps:
      - name: Install what the image lacks
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends jq git curl unzip xz-utils python3-yaml
          git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage the source where F-Droid builds it
        run: |
          mkdir -p "$(dirname "$BUILD_DIR")"
          rm -rf "$BUILD_DIR"
          cp -a "$GITHUB_WORKSPACE" "$BUILD_DIR"

      # Cloned rather than taken from a setup action, so the SDK lands on the
      # same path F-Droid's srclib uses and sits at the same commit.
      - name: Set up Flutter
        run: |
          git clone --quiet https://github.com/flutter/flutter.git "$FLUTTER_DIR"
          git -C "$FLUTTER_DIR" checkout -f "$FLUTTER_VERSION"
          "$FLUTTER_DIR/bin/flutter" config --no-analytics
          "$FLUTTER_DIR/bin/flutter" --version

      - name: Pin the NDK
        run: |
          ndk="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          [ -d "$ndk" ] || sdkmanager "ndk;$ANDROID_NDK_VERSION"
          test -d "$ndk" || { echo "::error::NDK $ANDROID_NDK_VERSION unavailable"; exit 1; }
          for v in ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK; do
            echo "$v=$ndk" >> "$GITHUB_ENV"
          done

      # --enforce-lockfile, not a plain pub get. Without it resolution picks
      # whatever versions it likes and rewrites the lockfile in place, which
      # is how the committed copy drifted far enough to still name geolocator
      # long after 1.6.0 removed it. Regenerate deliberately, via the
      # refresh-lockfile workflow.
      - name: Install dependencies
        working-directory: /home/vagrant/build/com.zaifears.locreminder
        run: |
          export PUB_CACHE="$BUILD_DIR/.pub-cache"
          "$FLUTTER_DIR/bin/flutter" pub get --enforce-lockfile

      # The generated string files are committed rather than built, so that no
      # code generation runs inside a build F-Droid reproduces byte for byte.
      # That only works if they are kept in step with their source, which is
      # what this checks. If it fails, run: python tool/gen_locale.py
      - name: Check the generated strings match locale/*.yaml
        working-directory: /home/vagrant/build/com.zaifears.locreminder
        run: python3 tool/gen_locale.py --check

      # F-Droid and Play both cut the "What's New" text off at 500 characters,
      # and neither warns you — the entry just arrives truncated. An F-Droid
      # reviewer caught 1.8.0's at 734. Cheaper to fail here than to find out
      # from a reviewer.
      - name: Check the changelogs fit the store limit
        working-directory: /home/vagrant/build/com.zaifears.locreminder
        run: |
          python3 - <<'PY'
          import glob, os, sys
          bad = []
          for path in sorted(glob.glob('fastlane/metadata/android/*/changelogs/*.txt')):
              n = len(open(path, encoding='utf-8').read())
              if n > 500:
                  bad.append((path, n))
          for path, n in bad:
              print(f"::error file={path}::{n} characters; the store limit is 500")
          sys.exit(1 if bad else 0)
          PY

      - name: Analyze
        working-directory: /home/vagrant/build/com.zaifears.locreminder
        run: |
          export PUB_CACHE="$BUILD_DIR/.pub-cache"
          "$FLUTTER_DIR/bin/flutter" analyze

      - name: Run tests
        working-directory: /home/vagrant/build/com.zaifears.locreminder
        run: |
          export PUB_CACHE="$BUILD_DIR/.pub-cache"
          "$FLUTTER_DIR/bin/flutter" test

      # A tag is what publishes a Release, so it is where debug signing stops
      # being a harmless convenience and starts being shipped to users. Every
      # release up to v1.6.5 went out debug-signed precisely because nothing
      # complained.
      - name: Require a real signing key for published builds
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD"  ] && missing="$missing RELEASE_STORE_PASSWORD"
          [ -z "$KEY_ALIAS"       ] && missing="$missing RELEASE_KEY_ALIAS"
          [ -z "$KEY_PASSWORD"    ] && missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Refusing to publish a release. Missing secrets:$missing"
            exit 1
          fi

      - name: Prepare release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$BUILD_DIR/android/locreminder-release.jks"
            echo "path=$BUILD_DIR/android/locreminder-release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        working-directory: /home/vagrant/build/com.zaifears.locreminder
        env:
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export PUB_CACHE="$BUILD_DIR/.pub-cache"
          "$FLUTTER_DIR/bin/flutter" build apk --release --split-per-abi

      # Brought back into the workspace so the upload and release actions,
      # which expect paths under it, can reach the file.
      - name: Collect the APK
        run: |
          ls -la "$BUILD_DIR/build/app/outputs/flutter-apk/"
          cp "$BUILD_DIR"/build/app/outputs/flutter-apk/*.apk "$GITHUB_WORKSPACE/"

      # The gate above proves the secrets exist; this proves they were used.
      # Gradle's fallback to the debug key is silent, so the finished APK is
      # the only trustworthy evidence. All four APKs are checked — a split
      # that slips through debug-signed would still reach users who sideload.
      - name: Verify the published APKs are not debug-signed
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          [ -n "$apksigner" ] || { echo "::error::apksigner not found"; exit 1; }
          failed=0
          for apk in "$GITHUB_WORKSPACE"/app-release.apk \
                     "$GITHUB_WORKSPACE"/app-armeabi-v7a-release.apk \
                     "$GITHUB_WORKSPACE"/app-arm64-v8a-release.apk \
                     "$GITHUB_WORKSPACE"/app-x86_64-release.apk; do
            echo "--- $apk ---"
            certs=$("$apksigner" verify --print-certs "$apk")
            echo "$certs"
            if echo "$certs" | grep -qi "CN=Android Debug"; then
              echo "::error::$(basename "$apk") is signed with the public Android debug key."
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || { echo "::error::Refusing to publish — debug-signed APK detected."; exit 1; }

      # Runs before the Release exists, so a build that looks like malware is
      # never published in the first place. All four APKs are scanned; a split
      # APK that is somehow tampered but identical in name would still be
      # distributed. The universal APK drives the badge and the release body
      # (it is what the existing download link points at); the splits each get
      # their own row in the SECURITY-SCAN table.
      - name: Scan the APKs with VirusTotal
        id: virustotal
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          chmod +x .github/scripts/virustotal-scan.sh

          # Scan each APK in turn. The script writes to $GITHUB_OUTPUT, so we
          # prefix each file's outputs with a short tag to keep them separate.
          # We read them back out of GITHUB_OUTPUT after each call.
          declare -A VT_SHA VT_FLAGS VT_TOTAL VT_URL VT_STATUS

          scan_one() {
            local tag="$1" file="$2"
            # Isolate outputs by temporarily redirecting GITHUB_OUTPUT
            local tmp
            tmp=$(mktemp)
            GITHUB_OUTPUT="$tmp" .github/scripts/virustotal-scan.sh "$file" || true
            VT_SHA[$tag]=$(  grep '^sha256='       "$tmp" | cut -d= -f2-)
            VT_FLAGS[$tag]=$(grep '^detections='   "$tmp" | cut -d= -f2-)
            VT_TOTAL[$tag]=$(grep '^total='        "$tmp" | cut -d= -f2-)
            VT_URL[$tag]=$(  grep '^permalink='    "$tmp" | cut -d= -f2-)
            VT_STATUS[$tag]=$(grep '^status='      "$tmp" | cut -d= -f2-)
            rm -f "$tmp"
          }

          scan_one universal   "$GITHUB_WORKSPACE/app-release.apk"
          scan_one armeabi_v7a "$GITHUB_WORKSPACE/app-armeabi-v7a-release.apk"
          scan_one arm64_v8a   "$GITHUB_WORKSPACE/app-arm64-v8a-release.apk"
          scan_one x86_64      "$GITHUB_WORKSPACE/app-x86_64-release.apk"

          # Forward the universal APK's results as the step outputs that
          # downstream steps already expect (release note, badge colour, etc.)
          flags="${VT_FLAGS[universal]:-0}"
          total="${VT_TOTAL[universal]:-0}"
          sha="${VT_SHA[universal]:-}"
          url="${VT_URL[universal]:-}"
          status="${VT_STATUS[universal]:-unavailable}"

          echo "status=$status"                              >> "$GITHUB_OUTPUT"
          echo "detections=$flags"                          >> "$GITHUB_OUTPUT"
          echo "total=$total"                               >> "$GITHUB_OUTPUT"
          echo "sha256=$sha"                                >> "$GITHUB_OUTPUT"
          echo "permalink=$url"                             >> "$GITHUB_OUTPUT"
          note="**VirusTotal:** $flags of $total engines flagged this build — [full report]($url) · \`SHA-256: $sha\`"
          echo "release_note=$note"                         >> "$GITHUB_OUTPUT"

          # Also export all per-APK values for the SECURITY-SCAN recording step.
          for tag in universal armeabi_v7a arm64_v8a x86_64; do
            echo "vt_sha_${tag}=${VT_SHA[$tag]:-}"         >> "$GITHUB_ENV"
            echo "vt_flags_${tag}=${VT_FLAGS[$tag]:-0}"    >> "$GITHUB_ENV"
            echo "vt_total_${tag}=${VT_TOTAL[$tag]:-0}"    >> "$GITHUB_ENV"
            echo "vt_url_${tag}=${VT_URL[$tag]:-}"         >> "$GITHUB_ENV"
            echo "vt_status_${tag}=${VT_STATUS[$tag]:-}"   >> "$GITHUB_ENV"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: location-alarm-apk
          path: "*.apk"
          if-no-files-found: error

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # All four APKs are attached. app-release.apk is the universal build
          # (same as before this change — the existing download link still works).
          # The three split APKs are extra, optional assets: ~18–22 MB each vs
          # the 56 MB universal, for users who want the smaller download.
          files: |
            app-release.apk
            app-armeabi-v7a-release.apk
            app-arm64-v8a-release.apk
            app-x86_64-release.apk
          generate_release_notes: true
          # Carries the hash as well as the verdict: the hash is what lets a
          # reader confirm the file they downloaded is the file that was
          # scanned, which the result alone does not establish.
          body: ${{ steps.virustotal.outputs.release_note }}

      # A tiny JSON the README badge reads, plus a page recording every scan.
      # A few hundred bytes each, so unlike the APK they cost nothing to keep.
      # The table now has 5 columns: Release, APK, Detections, Report, SHA-256.
      # Four rows are inserted per release (one per APK), newest-first under the
      # header separator, the same way the single-row version worked.
      - name: Record the scan result
        if: startsWith(github.ref, 'refs/tags/v') && steps.virustotal.outputs.status == 'completed'
        env:
          FLAGGED:   ${{ steps.virustotal.outputs.detections }}
          TOTAL:     ${{ steps.virustotal.outputs.total }}
          SHA256:    ${{ steps.virustotal.outputs.sha256 }}
          PERMALINK: ${{ steps.virustotal.outputs.permalink }}
          VERSION:   ${{ github.ref_name }}
        run: |
          # This job checks out a tag, detached, and the build leaves tracked
          # files modified behind it. Start from a clean copy of current main
          # and regenerate there, so nothing is rebased over a dirty tree and
          # no row added since is clobbered.
          git fetch origin main
          git checkout -f -B record-scan FETCH_HEAD

          mkdir -p .github/badges
          colour=brightgreen
          [ "$FLAGGED" -gt 0 ] && colour=orange
          printf '{"schemaVersion":1,"label":"VirusTotal","message":"%s/%s","color":"%s"}\n' \
            "$FLAGGED" "$TOTAL" "$colour" > .github/badges/virustotal.json

          # Build 4 rows (universal last so it appears closest to the header,
          # since awk inserts them all right after the |--- separator line).
          # Order: x86_64, arm64-v8a, armeabi-v7a, universal — reversed so
          # that after four insertions the universal row ends up on top.
          ref="https://github.com/${GITHUB_REPOSITORY}/releases/tag/$VERSION"
          rows=""
          for tag_label in \
              "x86_64:app-x86_64-release.apk" \
              "arm64_v8a:app-arm64-v8a-release.apk" \
              "armeabi_v7a:app-armeabi-v7a-release.apk" \
              "universal:app-release.apk"; do
            tag="${tag_label%%:*}"
            apk="${tag_label##*:}"
            sha_var="vt_sha_${tag}"
            flags_var="vt_flags_${tag}"
            total_var="vt_total_${tag}"
            url_var="vt_url_${tag}"
            sha="${!sha_var}"
            flags="${!flags_var:-0}"
            total="${!total_var:-0}"
            url="${!url_var}"
            row="| [\`$VERSION\`]($ref) | \`$apk\` | $flags / $total | [report]($url) | \`$sha\` |"
            rows="$row"$'\n'"$rows"
          done
          # rows now starts with the universal row (inserted last into the file)
          awk -v rows="$rows" '
            {print}
            /^\|---/ && !done {printf "%s", rows; done=1}
          ' docs/SECURITY-SCAN.md > docs/SECURITY-SCAN.md.tmp
          mv docs/SECURITY-SCAN.md.tmp docs/SECURITY-SCAN.md

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/virustotal.json docs/SECURITY-SCAN.md
          git diff --cached --quiet && { echo "No change to record."; exit 0; }
          git commit -m "Record the $VERSION VirusTotal scan [skip ci]"
          git push origin HEAD:main

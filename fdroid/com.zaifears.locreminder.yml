AutoName: LocReminder

RepoType: git
Repo: https://github.com/zaifears/locreminder.git

Builds:
  - versionName: 1.6.1
    versionCode: 8
    commit: v1.6.1
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild: sed -i -e '/signingConfig = if (hasReleaseSigning)/d' android/app/build.gradle.kts
    build:
      - export PUB_CACHE=$PWD/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter build apk --release


Repo: https://github.com/zaifears/locreminder.git

Builds:
  - versionName: 1.6.0
    versionCode: 7
    commit: v1.6.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - sed -i -e '/signingConfig = if (hasReleaseSigning)/d' android/app/build.gradle.kts
    scanignore:
      - android/app/build.gradle.kts
    scandelete:
      - .pub-cache
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags

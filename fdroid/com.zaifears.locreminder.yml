Builds:
  - versionName: 1.6.15
    versionCode: 22
    commit: 5b24c9024f5a64d2c355d0d4bab78949ac0c66ca
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - sdkmanager "ndk;28.2.13676358" || true
      - flutterVersion=$(sed -n -E "s/.*FLUTTER_VERSION:\s*'(.*)'/\1/p" .github/workflows/build.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - sed -i -e '/signingConfig = if (hasReleaseSigning)/d' android/app/build.gradle.kts
      - export PUB_CACHE=$PWD/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358
      - export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
      - export ANDROID_NDK=$ANDROID_NDK_HOME
      - export PUB_CACHE=$PWD/.pub-cache
      - $$flutter$$/bin/flutter build apk --release


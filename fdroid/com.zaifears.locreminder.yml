IssueTracker: https://github.com/zaifears/locreminder/issues
Changelog: https://github.com/zaifears/locreminder/blob/main/CHANGELOG.md

AutoName: LocReminder

RepoType: git
Repo: https://github.com/zaifears/locreminder.git

Builds:
  - versionName: 1.6.8
    versionCode: 15
    commit: 82df7311b65bec6b73d28ae7bd53f0a8be115a24
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild: sed -i -e '/signingConfig = if (hasReleaseSigning)/d' android/app/build.gradle.kts
    build:
      - export PUB_CACHE=$PWD/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s*[\d.]+\+(\d+)|.|version:\s*([\d.]+)\+\d+
CurrentVersion: 1.6.8
CurrentVersionCode: 15

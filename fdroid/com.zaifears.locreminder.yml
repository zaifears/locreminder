AutoName: LocReminder

RepoType: git
Repo: https://github.com/zaifears/locreminder.git
Binaries: https://github.com/zaifears/locreminder/releases/download/v%v/app-release.apk

Builds:
  - versionName: 1.6.10
    versionCode: 17
    commit: ec3b56fa8227c5dc51e0087966988b5f56ed8d61
    sudo:
      - mkdir -p /home/runner/work/locreminder
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - sdkmanager "ndk;28.2.13676358" || true
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\s*'(.*)'/\1/p" .github/workflows/build.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - sed -i -e '/signingConfig = if (hasReleaseSigning)/d' android/app/build.gradle.kts
      - export repo=/home/runner/work/locreminder/locreminder
      - cd .. && mv com.zaifears.locreminder $repo && pushd $repo
      - export PUB_CACHE=$PWD/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd && mv $repo com.zaifears.locreminder && cd com.zaifears.locreminder
    scandelete:
      - .pub-cache
    build:
      - export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358
      - export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
      - export ANDROID_NDK=$ANDROID_NDK_HOME
      - export repo=/home/runner/work/locreminder/locreminder
      - cd .. && mv com.zaifears.locreminder $repo && pushd $repo
      - export PUB_CACHE=$PWD/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
      - popd && mv $repo com.zaifears.locreminder && cd com.zaifears.locreminder

AllowedAPKSigningKeys: e594d95da857cb75c7abf991915722086671815b7ee105cf9e224bec48858115


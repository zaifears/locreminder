name: locreminder
description: "Never miss your stop. A location-based alarm app built with Flutter."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  http: ^1.6.0
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 23

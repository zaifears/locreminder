name: locreminder
description: "Never miss your stop. A location-based alarm app built with Flutter."
publish_to: 'none'

version: 1.9.2+30

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  http: ^1.6.0
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The launcher icons under android/app/src/main/res are hand-authored and
# committed directly. flutter_launcher_icons is deliberately NOT used: running
# it would regenerate and overwrite that artwork on every build.
flutter:
  uses-material-design: true
  assets:
    - assets/images/
